name: Beta Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Beta
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build
        run: |
          make

      - name: Update Beta Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_OFFICIAL_TAG=$(git describe --tags --match "v*" --abbrev=0 2>/dev/null || echo "")
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "## Commit: \`$COMMIT_MSG\` (${{ github.sha }})" >> release_notes.md
          echo "### New in this build (Compared to $LATEST_OFFICIAL_TAG):" >> release_notes.md
            
          CHANGES=$(git log --pretty=format:"* %s (%h)" ${LATEST_OFFICIAL_TAG}..HEAD)
            
          if [ -z "$CHANGES" ]; then
            echo "* No code changes since $LATEST_OFFICIAL_TAG" >> release_notes.md
          else
            echo "$CHANGES" >> release_notes.md
          fi
          
          echo "### Commit SHA: ${{ github.sha }}" >> release_notes.md
          
          cat release_notes.md

          # Tao manifest.plist cho OTA update
          VERSION=$(grep -m1 'MARKETING_VERSION' Ksign.xcodeproj/project.pbxproj | sed 's/.*= //;s/;//;s/ //g')
          cat > packages/manifest.plist << EOFMANIFEST
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>items</key>
    <array>
        <dict>
            <key>assets</key>
            <array>
                <dict>
                    <key>kind</key>
                    <string>software-package</string>
                    <key>url</key>
                    <string>https://github.com/zheedevVn/ZheeSign/releases/download/beta/ZheeSign.ipa</string>
                </dict>
            </array>
            <key>metadata</key>
            <dict>
                <key>bundle-identifier</key>
                <string>vn.zheedev.zheesign</string>
                <key>bundle-version</key>
                <string>$VERSION</string>
                <key>kind</key>
                <string>software</string>
                <key>title</key>
                <string>ZheeSign</string>
            </dict>
        </dict>
    </array>
</dict>
</plist>
EOFMANIFEST
          
          gh release delete beta --cleanup-tag -y || true
          
          gh release create beta "packages/ZheeSign.ipa" "packages/manifest.plist" \
            --title "Latest Beta Build" \
            --notes "$(cat release_notes.md)" \
            --prerelease \
            --target ${{ github.sha }}

      - name: Notify Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          
          REPO="${{ github.repository }}"
          TAG="beta"
          FILENAME="ZheeSign.ipa"
          
          DOWNLOAD_URL="https://github.com/$REPO/releases/download/$TAG/$FILENAME"
          RELEASE_URL="https://github.com/$REPO/releases/tag/$TAG"
          
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "No Discord webhook configured, skipping."
            exit 0
          fi
          echo "Sending link to Discord..."
          
          VERSION=$(grep -m1 'MARKETING_VERSION' Ksign.xcodeproj/project.pbxproj | sed 's/.*= //;s/;//;s/ //g')
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          jq -n \
            --arg commit_msg "$COMMIT_MSG" \
            --arg download_url "$DOWNLOAD_URL" \
            --arg release_url "$RELEASE_URL" \
            --arg version "$VERSION" \
            --arg timestamp "$TIMESTAMP" \
            --arg repo "$REPO" \
            '{
              username: "ZheeSign Bot",
              embeds: [{
                title: "🚀 ZheeSign Beta Mới!",
                description: ("**Phiên bản:** `\($version)`\n**Thay đổi:** \($commit_msg)"),
                color: 9055202,
                fields: [
                  {name: "📲 Tải IPA", value: "[Bấm để tải](\($download_url))", inline: true},
                  {name: "📋 Chi tiết", value: "[Xem release](\($release_url))", inline: true}
                ],
                footer: {text: ("ZheeSign • \($repo)")},
                timestamp: $timestamp
              }]
            }' > discord_payload.json

          curl -v \
            -H "Content-Type: application/json" \
            -d @discord_payload.json \
            "$DISCORD_WEBHOOK"
